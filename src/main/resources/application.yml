spring:
  application:
    name: franchise-api
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:franchise}?sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USER:franchise}
    password: ${DB_PASSWORD:franchise}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:franchise}?sslmode=${DB_SSL_MODE:disable}
    user: ${DB_USER:franchise}
    password: ${DB_PASSWORD:franchise}
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always