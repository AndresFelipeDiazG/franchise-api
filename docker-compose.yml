services:
  postgres:
    image: postgres:16-alpine
    container_name: franchise-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-franchise}
      POSTGRES_USER: ${DB_USER:-franchise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-franchise}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - franchise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: franchise-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-franchise}
      DB_USER: ${DB_USER:-franchise}
      DB_PASSWORD: ${DB_PASSWORD:-franchise}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  franchise-postgres-data: